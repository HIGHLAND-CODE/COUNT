<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Expires" content="0">
<meta http-equiv="Last-Modified" content="0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>Conteo de Productos</title>
<link rel="icon" type="image/png" sizes="400x400" href="icon.png?v=1">
<link rel="apple-touch-icon" href="icon.png?v=1">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1.7" />
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<main>
<header class="app-header">
<h1>Conteo de Productos</h1>
<div class="quick-actions">
<button id="newCountButton" type="button" class="warning-button">Nuevo</button>
<button id="exportButton" type="button" disabled>Guardar</button>
</div>
</header>

<div id="cronometro" style="display:none;"></div>

<div id="panelInicio" class="inicio">
<div class="hero">
<img class="hero-logo" src="icon.png?v=1" alt="Highland Code" width="96" height="96">
<div class="hero-title">Empecemos un conteo</div>
<p>Elegí el proveedor que vas a contar. Después buscás cada producto y cargás lo que hay.</p>
<div id="pasosInicio" class="pasos"></div>
</div>
<input id="provFiltro" class="prov-filtro" type="search" placeholder="Buscar proveedor..." autocomplete="off" />
<div class="sec-title"><span>Proveedores</span><span id="provCantidad"></span></div>
<div id="provLista" class="prov-lista"></div>
</div>

<div id="pasosBanner" class="pasos pasos-banner"></div>

<section class="search-section">
<label for="searchInput">Buscar producto (Nombre o Código):</label>
<input id="searchInput" type="search" placeholder="Ingrese nombre o código..." autocomplete="off" />
</section>

<section class="product-list-section">
<h2>Productos encontrados</h2>
<div id="productList" class="product-list">Escriba para buscar...</div>
</section>

<section class="detail-section">
<h2>Datos del producto</h2>
<div id="detailCard" class="detail-card hidden">
<p><strong>Producto seleccionado:</strong> <span id="selectedProductName"></span></p>
<form id="productForm">
<label for="cantidadBultos">Cantidad de bultos</label>
<input id="cantidadBultos" type="number" inputmode="numeric" min="0" value="0" required />

<label for="unidadesSueltas">Unidades sueltas</label>
<input id="unidadesSueltas" type="number" inputmode="numeric" min="0" value="0" required />

<label for="fechaVencimiento">Fecha de vencimiento</label>
<input id="fechaVencimiento" type="date" required />

<button id="addEntryButton" type="submit">Agregar producto</button>
</form>
</div>
</section>

<section class="session-section">
<div id="sessionEntries" class="session-entries">No hay datos.</div>
</section>
</main>

<script src="script.js?v=1.19"></script>
</body>
</html>
